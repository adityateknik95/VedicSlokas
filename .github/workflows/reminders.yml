# Sends the daily sloka emails: every hour, the site emails students whose chosen hour it is.
# Needs two repository settings (Settings > Secrets and variables > Actions):
#   secret   CRON_SECRET  the same value as CRON_SECRET in Vercel
#   variable SITE_URL     e.g. https://vedicslokas.vercel.app
# Until REMINDERS_ENABLED=true in Vercel (after the email domain is verified) the site answers
# "disabled" and nothing is sent.
name: Daily sloka reminders

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the site to send this hour's reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$SITE_URL" ]; then echo "Not configured yet; skipping."; exit 0; fi
          status=$(curl -sS -o response.json -w "%{http_code}" -X POST -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/reminders")
          cat response.json; echo
          if [ "$status" = "409" ]; then echo "Reminders are switched off on the site."; exit 0; fi
          [ "$status" = "200" ]
